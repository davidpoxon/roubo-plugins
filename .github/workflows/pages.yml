name: pages

# Publish the signed marketplace catalog + signed key-ring to GitHub Pages at a
# stable URL (issue #305). The catalog lists every installable plugin that has a
# published Release, with its per-entry assetUrl + sha256, and is signed by the
# operational key; the key-ring is signed by the bootstrap ROOT key and resolves
# that operational key as 'active'. A key-resolution gate runs before deploy, so
# a catalog signed by an unknown/revoked key never ships.
#
# Entries are derived FROM the published Release assets, not from a fresh pack of
# main (davidpoxon/roubo-development#738): the assetUrl a client follows is a
# frozen tag asset, so regenerating digests from HEAD made the catalog advertise
# a digest no download could satisfy. A catalog-versus-asset gate re-fetches each
# assetUrl before deploy and fails the publish on any disagreement.
#
# Out-of-band prerequisites (this workflow only REFERENCES them):
#   - GitHub Pages is enabled for this repo with "GitHub Actions" as the source.
#   - Repo secrets MARKETPLACE_SIGNING_KEY (operational ed25519 PKCS8 PEM) and
#     MARKETPLACE_ROOT_SIGNING_KEY (root ed25519 PKCS8 PEM) are provisioned.
#
# Security posture mirrors release.yml: no untrusted `${{ }}` is interpolated
# into a run: script; GitHub-controlled values and secrets are bound to env vars
# and referenced as quoted shell variables. Signing keys reach the scripts only
# on stdin and are never written to disk, echoed, or uploaded.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "marketplace/**"
      - "scripts/release/**"
      - ".github/workflows/pages.yml"
  # Regenerate AFTER a release, not only on the `main` push that preceded it.
  # Now that entries are derived from the published asset, a version bump alone
  # is not enough: the bump lands on main first (firing the push trigger while
  # the tag, and therefore the asset, does not yet exist), so the freshly bumped
  # plugin would be skipped by fetch-release-assets.mjs and drop out of the
  # catalog until some unrelated push happened along. No `branches:` filter here
  # on purpose: release.yml is triggered by a TAG push, so the completed run has
  # no `main` head branch for such a filter to match. (`release: published` is
  # not usable either: release.yml creates the release with `github.token`, and
  # events raised by that token do not trigger further workflow runs.)
  workflow_run:
    workflows: ["release"]
    types:
      - completed

# Only the Pages deploy needs write; reading the repo is enough otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-publish; serialize concurrent publishes instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A failed release uploaded no asset, so there is nothing new to describe.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Pinned toolchain (.nvmrc) + clean install against the committed lockfile.
      # Nothing is packed or built here any more (the catalog is derived from the
      # published Release assets), but the release scripts still run under the
      # pinned runtime.
      - run: npm ci

      # Download the PUBLISHED Release asset for each installable plugin, rather
      # than packing a fresh tarball from main. The catalog's `source.assetUrl`
      # points at a frozen tag asset, so deriving the entry from a fresh pack made
      # the advertised digest track HEAD and drift away from the artifact a client
      # actually downloads (davidpoxon/roubo-development#738). A plugin whose
      # declared version has no published release is skipped with a warning and
      # simply does not appear in the catalog.
      - name: Fetch published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/fetch-release-assets.mjs --out-dir release-build

      # Derive the public halves of the signing secrets. The private keys stay on
      # the pipe (never written to disk); only the public PEMs are materialized.
      - name: Derive public keys
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
          MARKETPLACE_ROOT_SIGNING_KEY: ${{ secrets.MARKETPLACE_ROOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MARKETPLACE_SIGNING_KEY:-}" ]; then
            echo "MARKETPLACE_SIGNING_KEY secret is not set; cannot sign the catalog." >&2
            exit 1
          fi
          if [ -z "${MARKETPLACE_ROOT_SIGNING_KEY:-}" ]; then
            echo "MARKETPLACE_ROOT_SIGNING_KEY secret is not set; cannot sign the key-ring." >&2
            exit 1
          fi
          mkdir -p pages-build
          printf '%s' "$MARKETPLACE_SIGNING_KEY" | node scripts/release/derive-public-key.mjs > op-pub.pem
          printf '%s' "$MARKETPLACE_ROOT_SIGNING_KEY" | node scripts/release/derive-public-key.mjs > root-pub.pem

      # Generate + sign the catalog with the operational key (stdin only), applying
      # revocation from marketplace/key-ring.config.json. `--digest-source asset`
      # derives every entry (both digests AND its display metadata) from inside
      # the downloaded release tarball, so the catalog describes the artifact it
      # links to by construction.
      - name: Sign catalog
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$MARKETPLACE_SIGNING_KEY" | node scripts/release/sign-catalog.mjs \
            --build-dir release-build \
            --digest-source asset \
            --asset-base "https://github.com/${REPOSITORY}/releases/download" \
            --revoked-config marketplace/key-ring.config.json \
            --out pages-build/catalog.json

      # Sign the key-ring with the ROOT key (stdin only). The currently-active
      # operational key is injected from op-pub.pem so the ring resolves the
      # catalog's keyId; rotated-out keys come from the committed config.
      - name: Sign key-ring
        env:
          MARKETPLACE_ROOT_SIGNING_KEY: ${{ secrets.MARKETPLACE_ROOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$MARKETPLACE_ROOT_SIGNING_KEY" | node scripts/release/sign-key-ring.mjs \
            --config marketplace/key-ring.config.json \
            --active-key-file op-pub.pem \
            --out pages-build/key-ring.json

      # Publish gate: the catalog's keyId must resolve to an 'active' key in a
      # root-signed ring, and the catalog signature must verify against it. A
      # catalog signed by an unknown/revoked key fails the publish here.
      - name: Key-resolution gate
        run: |
          set -euo pipefail
          node scripts/release/verify-keyring.mjs \
            --catalog pages-build/catalog.json \
            --key-ring pages-build/key-ring.json \
            --root-key root-pub.pem \
            --revoked-config marketplace/key-ring.config.json

      # Publish gate: fetch every entry's source.assetUrl over HTTPS and assert
      # both its source.sha256 (tarball bytes) and its integrity (unpacked
      # artifact) against what that URL actually serves. This is what turns
      # catalog-versus-asset drift into a red build instead of a marketplace
      # install that fails its integrity check (#738).
      - name: Catalog-versus-asset gate
        run: |
          set -euo pipefail
          node scripts/release/verify-catalog-assets.mjs \
            --catalog pages-build/catalog.json

      # Only the two signed JSON envelopes go to Pages (the tarballs are Release
      # assets, not Pages content). Served at:
      #   https://davidpoxon.github.io/roubo-plugins/catalog.json
      #   https://davidpoxon.github.io/roubo-plugins/key-ring.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-build

      - id: deploy
        uses: actions/deploy-pages@v5
