id: claude-code
name: Claude Code
version: 0.4.0
description: Bundled agent plugin that launches Claude Code sessions with a configured model, effort, mode, and extra CLI arguments.
kind: agent
# `agentInstallLocations` below landed in host API 1.5.0, and the manifest schema
# is strict, so a host predating the field rejects this whole manifest on the
# unrecognised key rather than ignoring it. Pinning the floor does not change
# that: the host parses the manifest before it reads this range, so such a host
# reports an invalid manifest and never gets as far as a compatibility verdict.
# What the range does buy is the hosts it CAN speak to, one that knows the field
# but sits below 1.5.0, which refuses the plugin cleanly and names the version it
# reports. The other half of the gate is release order: this plugin ships only
# alongside a host carrying the field, so no released host meets it as an
# unknown key. Making the host answer with the version it needs, so the gate
# stops resting on release order, is davidpoxon/roubo-development#719.
roubo: ^1.5.0
entry: ./dist/index.js
contractVersion: 1
# Where the Claude Code CLI installs itself, probed in this order when `claude`
# is not on the PATH the Roubo server inherits: the native installer's per-user
# path, the legacy local-install shim, then Homebrew on Apple Silicon and on
# Intel, which is also npm's default global prefix.
#
# This list is an exact superset of the host's own legacy table for the `claude`
# base name, in the same order, and that is load-bearing rather than incidental.
# A declared list REPLACES that table for this CLI rather than merging with it,
# so dropping an entry would strand an install the host resolves today, and
# reordering one would change which binary wins where two are present. Add to the
# tail when a new install location appears; do not remove or reorder.
#
# The host's table stays where it is, frozen: it predates this field and is what
# an agent plugin declaring nothing still falls back to. Declaring the list here
# is what makes this plugin, rather than Roubo's core, the owner of its own CLI's
# install knowledge.
agentInstallLocations:
  - ~/.local/bin/claude
  - ~/.claude/local/claude
  - /opt/homebrew/bin/claude
  - /usr/local/bin/claude
# The agent-CLI compatibility window (AP-FR-014). `minVersion` is the inclusive
# floor a launch is blocked below: 2.1.111 is where `--permission-mode auto`
# replaced the removed `--enable-auto-mode` flag this plugin no longer emits.
# `testedCeiling` is the highest CLI this plugin was verified against (spike
# #504 exercised 2.1.207 end to end); a launch above it proceeds with a
# staleness warning rather than being blocked, because the CLI ships weekly.
agentCompatibility:
  minVersion: 2.1.111
  testedCeiling: 2.1.207
  # Lets the host read the installed CLI version without launching a session, so
  # the AI Agents screen can show a detected version and a within-range or
  # above-tested-ceiling verdict on a bench that was never started. Same command
  # and args as the descriptor's launch-time `versionProbe`; the two must agree.
  probe:
    command: claude
    args:
      - --version
    parse: semver
configSchema:
  type: object
  properties:
    model:
      title: Model
      type: string
      default: default
      description: The Claude model the session runs on. `Account default` sends no `--model` flag and defers to the account setting.
      oneOf:
        - const: default
          title: Account default
        - const: opus
          title: Opus
        - const: sonnet
          title: Sonnet
        - const: haiku
          title: Haiku
    effort:
      title: Effort
      type: string
      default: default
      # `default` is a sentinel, not an effort level, exactly as it is for
      # `model` and `mode` above and below. The settings form renders a closed
      # choice list with no clear control, so without an explicit sentinel
      # option a user who picked an effort could never get back to "send no
      # flag". It also keeps the form's displayed default honest: the host does
      # not seed configSchema defaults into the effective config, so the
      # sentinel is what an unsaved field actually behaves as.
      description: Reasoning effort passed as `--effort`. `CLI default` sends no flag and defers to the CLI's own default.
      oneOf:
        - const: default
          title: CLI default
        - const: low
          title: Low
        - const: medium
          title: Medium
        - const: high
          title: High
        - const: xhigh
          title: Extra high
        - const: max
          title: Max
    mode:
      title: Mode
      type: string
      default: default
      description: Permission mode passed as `--permission-mode`. `Default` sends no flag and defers to the account setting. A permission posture chosen on the project's permissions screen overrides this field, sending the posture's own `--permission-mode` value instead and dropping this field's flag, so exactly one `--permission-mode` ever reaches the CLI.
      oneOf:
        - const: default
          title: Default
        - const: plan
          title: Plan
        - const: auto
          title: Auto
        - const: acceptEdits
          title: Accept edits
        - const: manual
          title: Manual
    extraArgs:
      title: Additional CLI arguments
      type: string
      description: Free-form extra arguments appended after the generated flags. Split into discrete argv tokens with quoting honoured; shell metacharacters are never interpreted.
permissions:
  network:
    hosts: []
  credentials:
    slots: []
  filesystem:
    paths: []
  # Declarative agent plugin: translateLaunch() only emits an AgentLaunchDescriptor
  # the host validates and executes, so the plugin spawns nothing itself. An agent
  # plugin must declare `processes: false`; the descriptor is its only write route.
  processes: false
  ports: false
  docker: false
