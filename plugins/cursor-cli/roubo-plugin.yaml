id: cursor-cli
name: Cursor CLI
version: 0.1.0
description: Agent plugin that launches Cursor CLI sessions in a bench, with the jig injected as the initial prompt and extra CLI arguments appended as separate argv tokens.
kind: agent
# Built against @roubo/plugin-sdk 0.5.0, which carries host plugin API 1.6.0.
# `agentInstallLocations` below needs 1.5.0 on its own, and the sibling Cursor
# slices add the 1.6.0 manifest and descriptor members (`choiceProbes`, the
# `file-notifier` wiring). The manifest schema is strict, so pinning the 1.6.0
# floor now gives an older host a clean, version-named refusal rather than an
# unknown-key error once those members land.
roubo: ^1.6.0
entry: ./dist/index.js
contractVersion: 1
# Where the Cursor CLI installs itself, probed when `agent` is not on the PATH
# the Roubo server inherits. The official installer puts the `agent` command in
# `~/.local/bin`.
agentInstallLocations:
  - ~/.local/bin/agent
configSchema:
  type: object
  properties:
    mode:
      title: Mode
      type: string
      # Must equal DEFAULT_MODE in src/translate-launch.ts; a test asserts it.
      default: agent
      description: The operating mode the session starts in, passed as `--mode`. `Agent` is the CLI's own default and sends no flag.
      oneOf:
        - const: agent
          title: Agent
        - const: plan
          title: Plan
        - const: ask
          title: Ask
    extraArgs:
      title: Additional CLI arguments
      type: string
      description: Free-form extra arguments appended after the generated flags. Split into discrete argv tokens with quoting honoured; shell metacharacters are never interpreted. Cursor's worktree flags (`-w`, `--worktree`, `--worktree-base`, `--skip-worktree-setup`) are refused, because Roubo owns the worktree.
permissions:
  network:
    hosts: []
  credentials:
    slots: []
  filesystem:
    paths: []
  # Declarative agent plugin: translateLaunch() only emits an AgentLaunchDescriptor
  # the host validates and executes, so the plugin spawns nothing itself. An agent
  # plugin must declare `processes: false`; the descriptor is its only write route.
  processes: false
  ports: false
  docker: false
